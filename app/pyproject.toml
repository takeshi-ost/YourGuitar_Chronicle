[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "your-guitar-chronicle"
version = "0.2.0"
description = "Local Chronicle Engine for guitar provenance observations"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
authentication-test = ["Pillow>=11,<13", "numpy>=2,<3", "opencv-python-headless>=4.10,<5"]

[project.scripts]
ygc = "ygc.cli:app"
ygc-web = "ygc.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ygc = ["db/schema.sql", "static/*.html", "static/*.css", "static/*.js", "static/*.webp", "static/logos/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
