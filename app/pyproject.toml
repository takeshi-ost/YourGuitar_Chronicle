[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "your-guitar-chronicle"
version = "0.2.0"
description = "Local Chronicle Engine for guitar provenance observations"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
browser = ["playwright>=1.50,<2"]
postgres = ["psycopg[binary]>=3.3,<4"]
identity = ["firebase-admin>=7,<8"]
storage = ["google-cloud-storage>=3.16,<4"]

[project.scripts]
ygc = "ygc.cli:app"
ygc-web = "ygc.web:main"
ygc-postgres = "ygc.db.postgres:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ygc = ["db/schema.sql", "db/postgres/*.sql", "db/postgres/*.json", "static/*.html", "static/*.css", "static/*.js", "static/pages/*.css", "static/pages/*.js", "static/*.webp", "static/logos/*.png", "static/locales/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
