<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Guitar Chronicle — Members</title>
<link rel="stylesheet" href="/assets/cloud-members.css">
<script src="/assets/i18n.js" defer></script><script src="/assets/identity-platform-auth.js" defer></script>
<script src="/assets/cloud-members.js" type="module"></script></head>
<body><header><a href="/">Your Guitar Chronicle</a><nav class="page-nav" aria-label="Language"></nav></header>
<main><nav class="member-nav"><a href="/account" data-i18n="members.account">Your account</a><a href="/members" data-member-nav data-i18n="members.title">Members</a><a id="memberSelf" hidden data-member-nav data-i18n="members.self">Your member page</a><button id="memberSignOut" hidden data-i18n="account.sign_out">SignOut</button></nav>
<p id="memberStatus" role="status" aria-live="polite"></p><p id="memberGuest" hidden><span data-i18n="members.signin">Sign in with a verified account to browse members.</span> <a href="/account" data-i18n="account.sign_in">Sign In</a></p>
<button id="memberRefresh" type="button" data-i18n="action.refresh">Refresh</button>
<section id="memberSearch" hidden><h1 data-i18n="members.title">Members</h1>
<form id="memberSearchForm"><label for="memberQuery" data-i18n="members.search_label">Display name</label><input id="memberQuery" name="q" maxlength="120" type="search"><button type="submit" data-i18n="members.search">Search</button></form>
<p id="memberCount"></p><ul id="memberResults" class="people"></ul><nav class="pager"><a id="memberFirst" hidden data-member-nav data-i18n="members.first">First page</a><a id="memberNext" hidden data-member-nav data-i18n="members.next">Next page</a></nav></section>
<section id="memberProfile" hidden aria-labelledby="memberName"><span id="memberAvatar" class="person-icon large" aria-hidden="true">♙</span><h1 id="memberName"></h1>
<p data-i18n="members.profile_notice">Names, permitted icons and Follow connections are shown here. Other profile information is not shared on this page.</p>
<button id="memberFollow" type="button" hidden></button><div class="connections"><button id="memberFollowers" type="button"></button><button id="memberFollowing" type="button"></button></div></section>
</main><dialog id="memberConnections" aria-labelledby="memberConnectionsTitle"><h2 id="memberConnectionsTitle"></h2><p id="memberConnectionsStatus" role="status"></p><ul id="memberConnectionsList" class="people"></ul><button id="memberMore" type="button" hidden data-i18n="members.more">Load more</button><button id="memberClose" type="button" data-i18n="members.close">Close</button></dialog></body></html>
