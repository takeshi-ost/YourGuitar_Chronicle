name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python, JavaScript, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            app/pyproject.toml
            app/constraints.txt
            app/build-requirements.txt
            scripts/install_dependencies.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install pinned dependencies
        run: python scripts/install_dependencies.py --browser

      - name: Check dependency definitions and pins
        run: python scripts/check_dependencies.py

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run all checks with disposable storage
        run: python scripts/run_tests.py --browser --browser-artifacts test-artifacts

      - name: Save failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-diagnostics
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
