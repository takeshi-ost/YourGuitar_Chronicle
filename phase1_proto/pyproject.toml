[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "your-guitar-chronicle"
version = "0.2.0"
description = "Phase 1 local Chronicle Engine for Reverb API observations"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ygc = "ygc.cli:app"
ygc-web = "ygc.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
