[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "your-guitar-chronicle"
version = "0.1.0"
description = "Phase 0 local Chronicle Engine for Reverb API observations"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1", "rich>=13,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ygc = "ygc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
